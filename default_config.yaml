# SemiShape CAD Generator - Default Configuration
# These values are used unless overridden per-project in .a0proj/plugins/semishape/config.yaml

# --- API ---
# OpenRouter API key is read from the Agent Zero environment (API_KEY_OPENROUTER or OPENROUTER_API_KEY).
# You can override it here, but it is not recommended — use Agent Zero secrets instead.
openrouter_api_key: ""

# --- Model ---
# SemiShape does NOT manage model selection.
# It uses whatever model is currently active in your Agent Zero conversation.
# To switch models, change the active model in Agent Zero settings.

# --- Paths ---
output_dir: "/a0/usr/projects/semishape/output"

# --- Generation ---
execution_timeout: 60
sandbox_enabled: true
default_export_format: "stl"

# --- Language ---
default_language: "cs"
